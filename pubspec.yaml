name: muhurtham
description: "Premium Wedding Booking Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Fonts
  google_fonts: ^6.3.1

  # SVG Icons
  flutter_svg: ^2.2.0


  # Animations
  lottie: ^3.3.1
  shimmer: ^3.0.0



  # Cached Images
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/muhurtam.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
